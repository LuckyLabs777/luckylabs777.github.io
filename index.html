<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000400">
  <meta name="color-scheme" content="dark">
  <meta name="robots" content="noindex,nofollow">
  <meta name="description" content="LuckyLabs777 — digital entrance">
  <title>LuckyLabs777</title>
  <style>
    :root { color-scheme: dark; --code: #a9ffbb; --dim: #65b77f; }
    *,*::before,*::after {box-sizing:border-box}
    html,body {width:100%;min-height:100%;margin:0;background:#000400;overflow:hidden}
    body {font-family:Consolas,"SFMono-Regular","Courier New",monospace;color:var(--code)}
    main {height:100vh;height:100svh;position:relative;overflow:hidden;isolation:isolate;background:#000400}
    #rain {position:absolute;inset:0;display:block;width:100%;height:100%;z-index:0}
    .veil {position:absolute;inset:0;z-index:1;pointer-events:none;background:
      radial-gradient(ellipse at center,rgba(0,1,0,.02) 0%,rgba(0,1,0,.12) 55%,rgba(0,0,0,.58) 100%),
      linear-gradient(0deg,rgba(0,4,0,.55),transparent 20%,transparent 80%,rgba(0,4,0,.32));}
    .center {position:absolute;inset:0;z-index:2;display:grid;place-items:center;padding:18px;pointer-events:none}
    .insignia {position:relative;isolation:isolate;margin:0;max-width:100%;font-size:clamp(16px,2.3vw,30px);font-weight:500;letter-spacing:clamp(.21em,1.25vw,.48em);text-indent:clamp(.21em,1.25vw,.48em);text-align:center;line-height:1.5;white-space:nowrap;color:rgba(233,255,236,.9);text-shadow:0 0 11px #00aa38,0 0 45px #007120;opacity:0;filter:blur(14px);transform:scale(1.028);transition:opacity 3.33s ease,filter 3.33s ease,transform 3.33s ease}
    .insignia.visible {opacity:1;filter:blur(0);transform:scale(1)}
    .insignia.instant {transition:none}
    .insignia::before {content:"";position:absolute;z-index:-1;inset:-25px -34px;background:radial-gradient(ellipse at center,rgba(0,2,0,.77),rgba(0,2,0,.39) 39%,transparent 77%);pointer-events:none}
    .insignia span {color:#acffc4}
    /* Cinematic lock-on: the digits are only a visual motif, not identity recognition. */
    .trace {position:absolute;z-index:3;top:50%;left:50%;transform:translate(-50%,-50%);display:grid;place-items:center;width:min(100%,720px);padding:12px 16px 15px;pointer-events:none;opacity:0;filter:blur(9px);transition:opacity .55s ease,filter .55s ease,transform 1.45s ease}
    .trace.active {opacity:1;filter:none}
    .trace.disperse {opacity:0;filter:blur(15px);transform:translate(-50%,-50%) scale(1.19)}
    .trace::before {content:"";position:absolute;z-index:-1;inset:-60px -20px;background:radial-gradient(ellipse at center,rgba(0,2,0,.94),rgba(0,2,0,.66) 47%,transparent 75%)}
    .greeting {grid-area:1/1;white-space:nowrap;color:#baffc9;font-size:clamp(22px,3.6vw,52px);font-weight:400;letter-spacing:.02em;text-shadow:0 0 13px #06a43d,0 0 36px #027b23;opacity:0;filter:blur(6px);transition:opacity .35s ease,filter .45s ease;min-height:1.3em;text-align:center}
    .trace.show-greeting .digits {opacity:0;filter:blur(10px);transform:scale(1.06)}
    .trace.show-greeting .greeting {opacity:1;filter:none}
    .digits {grid-area:1/1;display:flex;justify-content:center;gap:clamp(2px,.5vw,9px);font-size:clamp(22px,4.6vw,67px);font-variant-numeric:tabular-nums;line-height:1.2;font-weight:400;color:#a9ffb7;text-shadow:0 0 15px #02ad3a,0 0 32px rgba(3,174,62,.7);white-space:nowrap;transition:opacity .35s ease,filter .45s ease,transform .45s ease}
    .digit {display:inline-block;min-width:.60em;text-align:center;opacity:.75;filter:blur(1px);transition:opacity .18s ease,filter .22s ease,color .22s ease,transform .16s ease}
    .digit.locked {opacity:1;filter:none;color:#effff0;transform:translateY(-1px)}
    .trace.settled .digits {text-shadow:0 0 10px #06aa3c,0 0 45px #008a28}
    .sr {position:absolute;left:-10000px;width:1px;height:1px;overflow:hidden}
    .skip {position:absolute;z-index:10;left:-10000px;top:10px;background:#000;color:#a9ffbb;border:1px solid #a9ffbb;padding:9px 12px;font:inherit}
    .skip:focus-visible{left:10px;outline:2px solid #fff;outline-offset:2px}
    @media(max-width:480px){
      .insignia {font-size:clamp(15px,5vw,22px);letter-spacing:.14em;text-indent:.14em}
      .digits{font-size:clamp(21px,7.4vw,35px);gap:2px}
      .digit{min-width:.57em}
    }
    @media(prefers-reduced-motion:reduce){
      .insignia{transition:none;opacity:1;filter:none;transform:none}
      .trace{display:none}
    }
  </style>
</head>
<body>
  <main aria-label="LuckyLabs777 cinematic digital entrance">
    <canvas id="rain" aria-hidden="true"></canvas>
    <div class="veil" aria-hidden="true"></div>
    <button class="skip" type="button" id="skip">Skip introduction</button>
    <div class="trace" id="trace" aria-hidden="true">
      <div class="digits" id="digits"></div>
      <div class="greeting" id="greeting"></div>
    </div>
    <div class="center"><h1 class="insignia" id="wordmark">LUCKYLABS<span>777</span></h1></div>
    <p class="sr" id="a11y-description">Green cascading characters become a sequence of numbers, then the words Hello, Neo appear before LuckyLabs777. The numbers do not identify the visitor.</p>
    <noscript><style>.insignia{opacity:1!important;filter:none!important;transform:none!important}</style></noscript>
  </main>
  <script>
  (() => {
    'use strict';
    const canvas = document.getElementById('rain');
    const ctx = canvas.getContext('2d', {alpha:false});
    const trace = document.getElementById('trace');
    const digits = document.getElementById('digits');
    const greeting = document.getElementById('greeting');
    const wordmark = document.getElementById('wordmark');
    const skip = document.getElementById('skip');
    const motion = window.matchMedia('(prefers-reduced-motion: reduce)');
    const glyphs = Array.from('0123456789ABCDEFGHJKLMNPQRSTVWXYZｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉﾊﾋﾌﾍﾎﾏﾐﾑﾒﾓﾔﾕﾖﾗﾘﾙﾚﾛﾜｦﾝ');
    const styles = [
      {size:13,step:16,density:.70,velocity:[45,89],length:[16,37],opacity:.45},
      {size:19,step:23,density:.88,velocity:[86,148],length:[24,49],opacity:.90},
      {size:27,step:48,density:.52,velocity:[114,190],length:[15,34],opacity:.63}
    ];
    const colors = ['#05240e','#095c24','#148b38','#21b84b','#4be979','#a4ffc0','#effff0'];
    let streams = [], atlases = [], raf = 0;
    let W = 1, H = 1, dpr = 1, prev = 0, frameBucket = 0, running = false, pendingResize = false;

    function randInt(n) {
      if (!n || n < 1) return 0;
      return Math.floor(Math.random()*n); // decorative animation only
    }
    function range(a,b) {return a+Math.random()*(b-a)}
    // Meaningful but privacy-respecting: MMDDHHMMSS from this browser's local clock.
    // This is NOT a visitor identity, phone number, IP address or fingerprint.
    function localStamp(date) {
      const two = n => String(n).padStart(2,'0');
      return two(date.getMonth()+1)+two(date.getDate())+
        two(date.getHours())+two(date.getMinutes())+two(date.getSeconds());
    }
    // Five consecutive acts. Every act lasts precisely 3,330 ms of visible-page time:
    // (1) roll & lock, (2) hold digits, (3) type greeting,
    // (4) hold greeting, (5) fade in wordmark.
    const ACT_MS = 3330;
    const GREETING = 'Hello, Neo...';
    let introRaf=0, introRunning=false, introFinished=false;
    let introStart=0, introElapsed=0, lastShuffle=-Infinity;
    let digitSpans=[], target='';
    function pauseIntro() {
      if (!introRunning) return;
      introElapsed=Math.max(0,performance.now()-introStart);
      cancelAnimationFrame(introRaf);
      introRunning=false;
    }
    function reveal(instant=false) {
      if (introFinished) return;
      introFinished=true;
      pauseIntro();
      trace.classList.remove('active');
      trace.classList.add('disperse');
      if (instant) wordmark.classList.add('instant');
      wordmark.classList.add('visible');
    }
    function updateIntro(elapsed) {
      // ACT 1 [0,3330): scrolling numbers settle from left to right.
      if (elapsed < ACT_MS) {
        if (elapsed-lastShuffle>=55) {
          lastShuffle=elapsed;
          for (let i=0;i<digitSpans.length;i++) {
            // Lock the first at 500ms and the last at 3200ms.
            // All ten have settled when act 2 begins.
            if (elapsed >= 500+i*300) {
              if (!digitSpans[i].classList.contains('locked')) {
                digitSpans[i].textContent=target[i];
                digitSpans[i].classList.add('locked');
              }
            } else {
              digitSpans[i].textContent=String(randInt(10));
            }
          }
        }
      } else if (!trace.classList.contains('settled')) {
        // ACT 2 [3330,6660): quiet 3.33s pause with all digits locked.
        for (let i=0;i<digitSpans.length;i++) {
          digitSpans[i].textContent=target[i];
          digitSpans[i].classList.add('locked');
        }
        trace.classList.add('settled');
      }
      // ACT 3 [6660,9990): slowly type the greeting across 3.33s.
      if (elapsed >= 2*ACT_MS) {
        trace.classList.add('show-greeting');
        const count=Math.min(GREETING.length,
          Math.floor((elapsed-2*ACT_MS)*GREETING.length/ACT_MS));
        const next=GREETING.slice(0,count);
        if (greeting.textContent!==next) greeting.textContent=next;
      }
      // ACT 4 [9990,13320): keep the complete greeting on screen.
      if (elapsed >= 3*ACT_MS) greeting.textContent=GREETING;
      // ACT 5 [13320,16650): wordmark fades in over exactly 3.33s.
      if (elapsed >= 4*ACT_MS) reveal();
    }
    function introFrame(now) {
      if (!introRunning) return;
      introElapsed=Math.max(0,now-introStart);
      updateIntro(introElapsed);
      if (!introFinished) introRaf=requestAnimationFrame(introFrame);
    }
    function runIntro() {
      if (introFinished || introRunning || motion.matches) return;
      introStart=performance.now()-introElapsed;
      introRunning=true;
      introRaf=requestAnimationFrame(introFrame);
    }
    function opening() {
      target=localStamp(new Date());
      greeting.textContent='';
      digits.replaceChildren();
      digitSpans=Array.from({length:10},() => {
        const s=document.createElement('span');
        s.className='digit';s.textContent=String(randInt(10));
        digits.appendChild(s);return s;
      });
      trace.classList.add('active');
      runIntro();
    }
    // Render each glyph once into original sprite atlases, rather than running
    // thousands of shadow-blurred fillText operations every animation frame.
    function buildAtlas(size) {
      const pad = Math.ceil(size*.43), tileW = Math.ceil(size*1.23)+pad*2;
      const tileH = Math.ceil(size*1.23)+pad*2, n = glyphs.length;
      const a = document.createElement('canvas');
      a.width = tileW*n;
      a.height = tileH*colors.length*2;
      const c = a.getContext('2d');
      c.textAlign = 'center'; c.textBaseline='middle';
      c.font = `500 ${size}px "Yu Gothic","Meiryo","Noto Sans CJK JP",monospace`;
      for(let flipped=0;flipped<2;flipped++){
        for(let level=0;level<colors.length;level++){
          for(let gi=0;gi<n;gi++){
            const x=gi*tileW+tileW/2, y=(flipped*colors.length+level)*tileH+tileH/2;
            c.save(); c.translate(x,y);
            if(flipped && /[\uFF61-\uFF9F]/.test(glyphs[gi])) c.scale(-1,1);
            c.fillStyle=colors[level];
            if(level>3) {c.shadowColor=colors[level]; c.shadowBlur=level===6?size*.73:size*.44;}
            c.fillText(glyphs[gi],0,0);
            c.restore();
          }
        }
      }
      return {canvas:a,tileW,tileH};
    }
    function rebuild() {
      const rect=canvas.getBoundingClientRect();
      W=Math.max(1,rect.width); H=Math.max(1,rect.height);
      dpr=Math.min(window.devicePixelRatio||1, W<=480?1.5:1.35);
      canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);
      ctx.setTransform(dpr,0,0,dpr,0,0);
      ctx.fillStyle='#000400';ctx.fillRect(0,0,W,H);
      atlases=styles.map(style=>buildAtlas(style.size));
      streams=[];
      for(let layer=0;layer<styles.length;layer++){
        const s=styles[layer], count=Math.ceil(W/s.step)+1;
        for(let col=0;col<count;col++){
          if(Math.random()>s.density) continue;
          const len=Math.round(range(...s.length));
          const slot=Array.from({length:len+6},()=>randInt(glyphs.length));
          streams.push({layer, size:s.size, opacity:s.opacity,
            x:col*s.step+range(-s.step*.22,s.step*.22),
            head:range(-H*.5,H*1.7),velocity:range(...s.velocity),
            len,slot,mirror:Math.random()>.36,seed:randInt(65535)});
        }
      }
      if(motion.matches) drawStill();
    }
    function drawSprite(stream,glyphIndex,brightness,x,y,alpha) {
      const atlas=atlases[stream.layer];
      const frame=(stream.mirror?colors.length:0)+brightness;
      ctx.globalAlpha=alpha;
      ctx.drawImage(atlas.canvas,glyphIndex*atlas.tileW,frame*atlas.tileH,
        atlas.tileW,atlas.tileH,x-atlas.tileW/2,y-atlas.tileH/2,atlas.tileW,atlas.tileH);
    }
    function paint(frozen=false) {
      ctx.globalAlpha=1;ctx.fillStyle='#000400';ctx.fillRect(0,0,W,H);
      for(const s of streams) {
        const headRow=Math.floor(s.head/s.size);
        const len=s.len;
        for(let j=len-1;j>=0;j--){
          const y=(headRow-j)*s.size;
          if(y < -s.size || y > H+s.size) continue;
          const progress=1-j/len;
          let shade=progress>.985?6:progress>.92?5:progress>.71?4:progress>.48?3:progress>.20?2:1;
          let opacity=s.opacity * (progress*.78+.09);
          if(j===0) opacity=s.opacity;
          if(s.layer===0) shade=Math.min(shade,4);
          let gi=s.slot[(headRow-j+s.slot.length*1000)%s.slot.length];
          drawSprite(s,gi,shade,s.x,y,opacity);
        }
      }
      ctx.globalAlpha=1;
    }
    function drawStill(){
      for(const s of streams) s.head=H*.94+range(-H*.65,H*.36);
      paint(true);
    }
    function tick(time) {
      raf=requestAnimationFrame(tick);
      if(document.hidden || motion.matches) {prev=0;return}
      if(prev && time-prev<31) return;
      const dt=prev?Math.min(.065,(time-prev)/1000):.033;
      prev=time;
      frameBucket++;
      for(const s of streams){
        s.head += dt*s.velocity;
        if(s.head-s.len*s.size>H+110){
          s.head=-range(s.size*3,H*.9);
          s.velocity=range(...styles[s.layer].velocity);
        }
        if(frameBucket%4===0){const n=randInt(s.slot.length);s.slot[n]=randInt(glyphs.length)}
      }
      paint();
    }
    function start() {if(!running){running=true;prev=0;raf=requestAnimationFrame(tick)}}
    function stop() {if(running){cancelAnimationFrame(raf);running=false;prev=0}}
    skip.addEventListener('click',()=>reveal(true));
    window.addEventListener('resize',()=>{
      if(pendingResize)return;
      pendingResize=true;
      requestAnimationFrame(()=>{pendingResize=false;rebuild()});
    },{passive:true});
    if(motion.addEventListener) motion.addEventListener('change',()=>{if(motion.matches){stop();reveal(true);drawStill()}else{rebuild();start();runIntro()}});
    else if(motion.addListener) motion.addListener(()=>{if(motion.matches){stop();reveal(true);drawStill()}else{rebuild();start();runIntro()}});
    document.addEventListener('visibilitychange',()=>{
      if(document.hidden){stop();pauseIntro()}
      else if(!motion.matches){start();runIntro()}
    });
    window.addEventListener('pagehide',()=>{stop();pauseIntro()});
    window.addEventListener('pageshow',e=>{
      if(e.persisted && !motion.matches && !document.hidden){start();runIntro()}
    });
    if(ctx){
      rebuild();
      if(!motion.matches){start();opening()}
      else {reveal(true)}
    }else reveal(true);
  })();
  </script>
</body>
</html>
