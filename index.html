<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000400">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex,nofollow">
<meta name="description" content="LuckyLabs777">
<meta name="lucky-release" content="cinematic-v0.7">
<title>LuckyLabs777</title>
<style>
:root{color-scheme:dark;--phosphor:#a4ffc0;--glow:#1eff76}
*,*::before,*::after{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#000400}
body{color:var(--phosphor);font-family:"Courier New",Consolas,monospace}
main{position:relative;width:100%;height:100vh;height:100svh;overflow:hidden;isolation:isolate;background:#000400}
#rain,#tunnel{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}
#rain{z-index:1;opacity:0;transform-origin:50% 50%;will-change:transform,opacity}
#tunnel{z-index:3;opacity:0;mix-blend-mode:screen}
.veil{z-index:4;position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,rgba(0,0,0,.02) 8%,rgba(0,0,0,.40) 100%)}
.scan{z-index:5;position:absolute;inset:0;pointer-events:none;opacity:.10;background:repeating-linear-gradient(180deg,transparent 0,transparent 3px,rgba(0,0,0,.48) 4px)}
.terminal{position:absolute;top:clamp(70px,21vh,218px);left:clamp(23px,9vw,156px);right:20px;z-index:8;
 font-size:clamp(15px,2.15vw,26px);line-height:1.64;font-weight:600;letter-spacing:.005em;
 color:#a4ffc0;text-shadow:0 0 2px rgba(31,251,110,.48),0 0 11px rgba(9,202,74,.42);opacity:1;
 overflow-wrap:anywhere;max-width:min(80vw,1050px)}
.line{margin:0;min-height:1.64em;white-space:pre-wrap}
.line:nth-child(3){margin-top:0}
.cursor{display:inline-block;vertical-align:-.12em;width:.59em;height:.98em;background:#a4ffc0;box-shadow:0 0 13px rgba(25,255,109,.65);animation:blink .86s steps(2,end) infinite}
@keyframes blink{50%{opacity:0}}
.cursor[hidden]{display:none}
.numbers{z-index:7;position:absolute;inset:0;display:grid;place-items:center;opacity:0;pointer-events:none}
.digits{display:flex;gap:clamp(1px,.5vw,9px);align-items:center;justify-content:center;white-space:nowrap;
 font-size:clamp(24px,5.4vw,76px);font-variant-numeric:tabular-nums;line-height:1;color:#b5ffcc;
 text-shadow:0 0 8px #13b955,0 0 23px rgba(11,188,70,.62);will-change:transform}
.digit{display:block;text-align:center;min-width:.56em;filter:blur(1.1px);opacity:.82}
.digit.locked{filter:none;opacity:1;color:#ebfff0;text-shadow:0 0 13px #24ff80,0 0 27px #158a40}
.wordmark-wrap{position:absolute;inset:0;z-index:10;pointer-events:none;display:grid;place-items:center;padding:18px}
.wordmark{position:relative;margin:0;max-width:100%;white-space:nowrap;text-align:center;line-height:1.45;
 font-size:clamp(18px,2.5vw,35px);font-weight:500;letter-spacing:clamp(.12em,.9vw,.34em);
 color:#e5ffea;text-shadow:0 0 14px #2add6b,0 0 46px rgba(0,141,56,.75);
 opacity:0;filter:blur(15px);transform:scale(.92);transition:opacity 3.33s ease,filter 3.33s ease,transform 3.33s cubic-bezier(.17,.73,.31,1)}
.wordmark.visible{opacity:1;filter:none;transform:scale(1)}
.wordmark span{color:#b2ffcb}
.wordmark::before{content:"";position:absolute;z-index:-1;left:-23%;right:-23%;top:-170%;bottom:-170%;background:radial-gradient(ellipse,rgba(0,6,2,.92),rgba(0,3,1,.57) 40%,transparent 73%)}
.skip{position:absolute;z-index:20;left:-10000px;top:12px;background:#001905;color:#d5ffe0;border:1px solid #a8ffc2;padding:11px 13px;font:inherit}
.skip:focus-visible{left:12px;outline:2px solid white;outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;clip-path:inset(50%);overflow:hidden;white-space:nowrap}
@media(max-width:560px){.terminal{top:clamp(60px,24vh,180px);left:clamp(17px,6vw,25px);right:17px;font-size:clamp(13px,3.45vw,18px);max-width:none}.digits{font-size:clamp(21px,7vw,40px);gap:1px}.digit{min-width:.53em}
.wordmark{font-size:clamp(17px,4.55vw,23px);letter-spacing:.10em}}
@media(max-width:340px){.terminal{font-size:12px}.wordmark{font-size:15px;letter-spacing:.07em}}
@media(prefers-reduced-motion:reduce){.wordmark{opacity:1!important;filter:none!important;transform:none!important;transition:none!important}
#rain,#tunnel,.terminal,.numbers,.cursor{display:none!important}}
</style>
</head>
<body>
<main aria-label="LuckyLabs777 cinematic entrance">
  <canvas id="rain" aria-hidden="true"></canvas>
  <canvas id="tunnel" aria-hidden="true"></canvas>
  <div class="veil" aria-hidden="true"></div><div class="scan" aria-hidden="true"></div>
  <section class="terminal" id="terminal" aria-label="Cinematic terminal dialogue">
    <p class="line" id="line0"></p><p class="line" id="line1"></p><p class="line" id="line2"></p>
  </section>
  <div class="numbers" id="numbers" aria-hidden="true"><div class="digits" id="digits"></div></div>
  <div class="wordmark-wrap"><h1 class="wordmark" id="wordmark">LUCKYLABS<span>777</span></h1></div>
  <button class="skip" id="skip" type="button">Skip introduction</button>
  <p class="sr">Cinematic green terminal dialogue becomes a field of digits, a glowing tunnel, and LuckyLabs777. The numeric pattern is decorative, generated within your browser, and does not identify you.</p>
  <noscript><style>.wordmark{opacity:1!important;filter:none!important;transform:none!important}.terminal{display:none!important}</style></noscript>
</main>
<script>
(()=>{
'use strict';
const ACT=3330,END=6*ACT,RELEASE='cinematic-v0.7';
const messages=['Wake up, Neo...','The Matrix has you...','Follow the white rabbit.'];
const $=id=>document.getElementById(id);
const rain=$('rain'),tunnel=$('tunnel'),r=rain.getContext('2d',{alpha:false}),p=tunnel.getContext('2d');
const terminal=$('terminal'),numbers=$('numbers'),digits=$('digits'),wordmark=$('wordmark');
const lines=[$('line0'),$('line1'),$('line2')],motion=matchMedia('(prefers-reduced-motion: reduce)');
const typedNodes=lines.map(el=>{const n=document.createTextNode('');el.append(n);return n});
const cursors=lines.map(el=>{const c=document.createElement('span');c.className='cursor';c.setAttribute('aria-hidden','true');c.hidden=true;el.append(c);return c});
const glyphs=Array.from('0123456789ABCDEFGHJKLMNPQRSTVWXYZｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉﾊﾋﾌﾍﾎﾏﾐﾑﾒﾓﾔﾕﾖﾗﾘﾙﾚﾛﾜｦﾝ');
const styles=[{size:13,step:20,density:.51,vel:[56,99],length:[18,37],opacity:.46},{size:19,step:25,density:.80,vel:[94,168],length:[24,48],opacity:.85},{size:27,step:49,density:.48,vel:[129,213],length:[18,38],opacity:.56}];
const shades=['#05230d','#085b22','#129037','#21bf55','#55ee88','#b8ffd1','#f3fff5'];
let W=1,H=1,dpr=1,streams=[],atlases=[],target='',cells=[],elapsed=0,origin=0,last=0,raf=0,running=false,complete=false,resizeQueued=false,frames=0;
const rand=n=>Math.floor(Math.random()*n),between=(a,b)=>a+Math.random()*(b-a),pad=n=>String(n).padStart(2,'0');
// Decorative number motif is derived in-browser from arrival time; it is never transmitted or persisted.
const stamp=d=>pad(d.getMonth()+1)+pad(d.getDate())+pad(d.getHours())+pad(d.getMinutes())+pad(d.getSeconds());
function atlas(size){
 const padSize=Math.ceil(size*.36),w=Math.ceil(size*1.14)+padSize*2,h=w,c=document.createElement('canvas');
 c.width=w*glyphs.length;c.height=h*shades.length*2;
 const g=c.getContext('2d');g.textAlign='center';g.textBaseline='middle';g.font=`500 ${size}px "Yu Gothic","Meiryo","Noto Sans CJK JP",monospace`;
 for(let flip=0;flip<2;flip++)for(let b=0;b<shades.length;b++)for(let i=0;i<glyphs.length;i++){
  g.save();g.translate((i+.5)*w,(flip*shades.length+b+.5)*h);
  if(flip && /[\uFF61-\uFF9F]/.test(glyphs[i]))g.scale(-1,1);
  g.fillStyle=shades[b];if(b>3){g.shadowColor=shades[b];g.shadowBlur=b===6?size*.61:size*.33}
  g.fillText(glyphs[i],0,0);g.restore();
 }
 return {canvas:c,w,h};
}
function size(){
 const rect=rain.getBoundingClientRect();W=Math.max(1,rect.width);H=Math.max(1,rect.height);
 dpr=Math.min(devicePixelRatio||1,W<520?1.25:1.35);
 for(const cv of [rain,tunnel]){cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr)}
 if(!r)return;
 r.setTransform(dpr,0,0,dpr,0,0);if(p)p.setTransform(dpr,0,0,dpr,0,0);
 atlases=styles.map(s=>atlas(s.size));streams=[];
 for(let layer=0;layer<styles.length;layer++){
  const s=styles[layer];for(let i=0;i<Math.ceil(W/s.step)+2;i++){
   if(Math.random()>s.density)continue;
   const len=Math.floor(between(...s.length));
   streams.push({layer,x:i*s.step+between(-s.step*.2,s.step*.2),head:between(-H,H*1.3),speed:between(...s.vel),len,
    slot:Array.from({length:len+6},()=>rand(glyphs.length)),mirror:Math.random()>.39});
  }
 }
 if(motion.matches)staticBrand();
}
function rainFrame(dt){
 if(!r)return;
 r.globalAlpha=1;r.fillStyle='#000400';r.fillRect(0,0,W,H);
 for(const s of streams){
  const cfg=styles[s.layer],a=atlases[s.layer];
  if(dt>0){s.head+=dt*s.speed;if(s.head-s.len*cfg.size>H+90){s.head=-between(cfg.size,H*.6);s.speed=between(...cfg.vel)}
    if(frames%4===0){const j=rand(s.slot.length);s.slot[j]=rand(glyphs.length)}}
  const row=Math.floor(s.head/cfg.size);
  for(let j=s.len-1;j>=0;j--){
   const y=(row-j)*cfg.size;if(y<-cfg.size||y>H+cfg.size)continue;
   const k=1-j/s.len,b=k>.99?6:k>.92?5:k>.72?4:k>.5?3:k>.24?2:1;
   r.globalAlpha=cfg.opacity*(k*.79+.08);
   const id=s.slot[((row-j)%s.slot.length+s.slot.length)%s.slot.length];
   r.drawImage(a.canvas,id*a.w,((s.mirror?shades.length:0)+Math.min(s.layer===0?4:6,b))*a.h,a.w,a.h,s.x-a.w/2,y-a.h/2,a.w,a.h);
  }
 }
 r.globalAlpha=1;
}
function codeTunnel(t){
 if(!p)return;
 p.clearRect(0,0,W,H);
 const u=Math.max(0,Math.min(1,(t-4*ACT)/ACT));if(u<=0||u>=1)return;
 const power=Math.pow(Math.sin(Math.PI*u),.54),cx=W*.5,cy=H*.5;
 const n=W<600?21:32,steps=W<600?21:30,max=Math.hypot(W,H)*.82;
 p.globalCompositeOperation='screen';
 // Depth-mapped light bands: original perspective geometry, not sampled film imagery.
 for(let i=0;i<n;i++){
  const z=(i/n+u*2.5)%1,depth=.012+Math.pow(z,2.0)*1.12;
  const rx=max*.96*depth,ry=max*.64*depth;
  const alpha=Math.min(.9,power*(.27+z*.76));
  if(i%4===0){
   p.lineWidth=1.4+z*2.8;p.strokeStyle=`rgba(47,255,126,${alpha*.72})`;
   p.beginPath();p.ellipse(cx,cy,rx,ry,0,-1.24,1.24);p.stroke();
   p.beginPath();p.ellipse(cx,cy,rx,ry,0,Math.PI-1.24,Math.PI+1.24);p.stroke();
  }
  for(let k=0;k<steps;k++){
   const angle=k/steps*Math.PI*2;
   if(Math.abs(Math.cos(angle))<.22)continue;
   const bend=1+Math.sin(angle*6+i*1.1+u*12)*.035;
   const x=cx+Math.cos(angle)*rx*bend,y=cy+Math.sin(angle)*ry*bend;
   if(x<-25||x>W+25||y<-25||y>H+25)continue;
   const glint=(i*7+k*11)%39===0;
   p.lineWidth=glint?2:1.1;
   p.strokeStyle=glint?`rgba(205,255,218,${Math.min(1,alpha*2)})`:`rgba(45,244,117,${alpha})`;
   p.beginPath();p.moveTo(x-Math.cos(angle)*(2+z*5),y-Math.sin(angle)*(2+z*4));
   p.lineTo(x+Math.cos(angle)*(4+z*21),y+Math.sin(angle)*(4+z*18));p.stroke();
  }
 }
 // Luminous sidewalls ripple inward around a dark central aperture.
 for(const side of [-1,1]){
  for(let k=0;k<17;k++){
   const v=k/16,dx=W*(.075+.375*v),yWave=Math.sin(v*17+u*16+side)*H*.012;
   p.strokeStyle=`rgba(56,255,135,${Math.min(.6,power*(.14+.44*v))})`;
   p.lineWidth=1.6+v*3.2;p.beginPath();p.moveTo(cx+side*dx,cy-H*(.22+.25*v)+yWave);
   p.bezierCurveTo(cx+side*dx*.7,cy-H*.13,cx+side*dx*.7,cy+H*.13,cx+side*dx,cy+H*(.22+.25*v)+yWave);p.stroke();
  }
 }
 p.globalCompositeOperation='source-over';
}
function digitSetup(){
 target=stamp(new Date());digits.replaceChildren();cells=Array.from({length:10},()=>{
  const s=document.createElement('span');s.className='digit';s.textContent=String(rand(10));digits.append(s);return s;
 });
}
function staticBrand(){
 complete=true;elapsed=END;terminal.style.display='none';numbers.style.display='none';tunnel.style.display='none';rain.style.opacity='0';
 wordmark.style.transition='none';wordmark.classList.add('visible');
}
function drawIntro(t){
 const act=Math.min(5,Math.floor(t/ACT)),progress=Math.min(1,Math.max(0,(t-act*ACT)/ACT));
 // Acts 1-3: three crisp messages, each given 3.33 seconds.
 if(t<3*ACT){
  terminal.style.opacity='1';rain.style.opacity='0';numbers.style.opacity='0';tunnel.style.opacity='0';
  for(let i=0;i<3;i++){
   const age=t-i*ACT;
   const typed=age<0?'':age<ACT?messages[i].slice(0,Math.floor(Math.min(1,age/2100)*messages[i].length)):messages[i];
   if(typedNodes[i].data!==typed)typedNodes[i].data=typed;
   cursors[i].hidden=!(i===act&&age>=0);
  }
  return;
 }
 // Act 4: terminal disappears into numeric code; ten digits converge and lock.
 if(t<4*ACT){
  const a=(t-3*ACT)/ACT;
  for(let i=0;i<3;i++){typedNodes[i].data=messages[i];cursors[i].hidden=true}
  terminal.style.opacity=String(Math.max(0,1-a*3.5));
  rain.style.opacity=String(Math.min(.94,a*2));
  numbers.style.opacity=String(Math.min(1,a*3));
  digits.style.transform=`scale(${(1+.12*a).toFixed(3)})`;
  for(let i=0;i<10;i++){
   const lock=290+i*290;
   if(t-3*ACT>=lock){cells[i].textContent=target[i];cells[i].classList.add('locked')}
   else if(frames%2===0)cells[i].textContent=String(rand(10));
  }
  return;
 }
 // Act 5: code falls toward the viewer and folds into a luminous portal.
 if(t<5*ACT){
  const a=(t-4*ACT)/ACT;
  terminal.style.opacity='0';rain.style.opacity=String(.94-.22*a);
  numbers.style.opacity=String(Math.max(0,1-a*4));
  rain.style.transform=`scale(${(1+a*.37).toFixed(3)})`;
  tunnel.style.opacity=String(Math.min(1,Math.sin(Math.PI*a)*1.28));
  codeTunnel(t);return;
 }
 // Act 6: the light collapses and LuckyLabs777 emerges for 3.33 seconds.
 terminal.style.opacity='0';numbers.style.opacity='0';
 rain.style.opacity=String(.7+.14*progress);rain.style.transform=`scale(${(1.37-.25*progress).toFixed(3)})`;
 tunnel.style.opacity=String(Math.max(0,1-progress*4));
 if(p)p.clearRect(0,0,W,H);
 if(!wordmark.classList.contains('visible'))wordmark.classList.add('visible');
 if(t>=END){complete=true;terminal.style.display='none';numbers.style.display='none';tunnel.style.opacity='0'}
}
function tick(now){
 if(!running)return;
 raf=requestAnimationFrame(tick);
 if(document.hidden||motion.matches){last=0;return}
 if(last&&now-last<(complete?50:33))return;
 const dt=last?Math.min(.07,(now-last)/1000):0;last=now;
 elapsed=now-origin;frames++;
 drawIntro(Math.min(END,elapsed));
 if(elapsed>=3*ACT||complete)rainFrame(dt);
}
function start(){if(running||motion.matches)return;origin=performance.now()-elapsed;last=0;running=true;raf=requestAnimationFrame(tick)}
function stop(){if(!running)return;elapsed=Math.min(END,performance.now()-origin);cancelAnimationFrame(raf);running=false;last=0}
function skip(){staticBrand();if(p)p.clearRect(0,0,W,H)}
$('skip').addEventListener('click',skip);
addEventListener('resize',()=>{if(resizeQueued)return;resizeQueued=true;requestAnimationFrame(()=>{resizeQueued=false;size()})},{passive:true});
function onMotion(){if(motion.matches){stop();skip()}else{size();start()}}
if(motion.addEventListener)motion.addEventListener('change',onMotion);else motion.addListener(onMotion);
document.addEventListener('visibilitychange',()=>{if(document.hidden)stop();else start()});
addEventListener('pagehide',stop);
addEventListener('pageshow',e=>{if(e.persisted&&!document.hidden)start()});
digitSetup();
if(r){size();if(motion.matches)skip();else start()}else staticBrand();
})();
</script>
</body>
</html>
